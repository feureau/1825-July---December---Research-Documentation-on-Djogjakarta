<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Full Transcriptions — 1825 Djogjakarta Archive</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: Arial, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; line-height: 1.65; }
        .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 25px; position: sticky; top: 0; background: #1a1a1a; padding-top: 10px; z-index: 10; }
        .btn { background: #2d2d2d; color: #e0e0e0; border: 1px solid #444; border-radius: 5px; padding: 8px 14px; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
        .btn:hover { background: #4a9eff; color: #ffffff; border-color: #4a9eff; }
        .jump-select { background: #2d2d2d; color: #e0e0e0; border: 1px solid #444; border-radius: 5px; padding: 8px 10px; font-family: Arial, sans-serif; font-size: 0.9rem; margin-left: auto; max-width: 280px; cursor: pointer; }
        .load-status { background: #222933; border: 1px solid #4a9eff55; border-left: 3px solid #4a9eff; color: #cfe3ff; padding: 10px 14px; border-radius: 4px; margin-bottom: 20px; font-size: 0.92rem; }
        h1, h2, h3 { color: #ffffff; }
        h2 { border-bottom: 1px solid #333; padding-bottom: 0.3em; }
        h3 { color: #cfe3ff; }
        hr { border: 0; border-top: 1px solid #333; margin: 16px 0; }
        blockquote { border-left: 4px solid #555; margin-left: 0; padding-left: 15px; color: #b0b0b0; }
        a { color: #4a9eff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        code { background: #2a2a2a; color: #e6edf3; padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
        .table-wrap { width: 100%; overflow-x: auto; margin: 14px 0; }
        table { width: 100%; border-collapse: collapse; background: #1f1f1f; font-size: 0.93rem; }
        th, td { border: 1px solid #444; padding: 10px 12px; text-align: left; vertical-align: top; }
        th { background-color: #2d2d2d; color: #ffffff; font-weight: bold; }
        td:first-child { width: 26%; color: #d4d4d4; background-color: #242424; }
        .transcription-section { margin-bottom: 45px; border-bottom: 2px solid #3a3a3a; padding-bottom: 28px; scroll-margin-top: 76px; }
        .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 16px; }
        .section-head h2 { border-bottom: none; padding-bottom: 0; margin: 0; }
        .section-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .render-error { background: #2a1414; border: 1px solid #ff6b6b55; border-radius: 6px; padding: 1.25rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <a class="btn" href="index.html">← Index</a>
        <a class="btn" href="transcriptions.html">Transcriptions</a>
        <a class="btn" href="dictionary.html">Keyword Dictionary</a>
        <select id="jump-select" class="jump-select" aria-label="Jump to transcription">
            <option value="">Jump to document…</option>
        </select>
    </div>

    <h1>Full Transcriptions</h1>
    <p>This page loads all 178 historical transcriptions sequentially in a single continuous scroll.</p>

    <div id="load-status" class="load-status">Initializing archive index…</div>
    <div id="markdown-output"></div>

    <script src="marked.min.js" defer></script>
    <script>
(function () {
  "use strict";

  const GITHUB_REPO = "feureau/1825-July---December---Research-Documentation-on-Djogjakarta";
  const OUTPUT_ID = "markdown-output";
  const STATUS_ID = "load-status";
  const BATCH_SIZE = 12;

  function configureMarked() {
    if (typeof marked === "undefined") return;
    marked.setOptions({ gfm: true, breaks: false });
  }

  function rewriteCrossReferences(root) {
    root.querySelectorAll('a[href*="39_Expanded_Keyword_Index.md"]').forEach(a => {
      const href = a.getAttribute("href") || "";
      const m = href.match(/#(L\d+)/i);
      if (m) {
        a.setAttribute("href", `dictionary.html#${m[1].toUpperCase()}`);
      } else {
        a.setAttribute("href", `dictionary.html?q=${encodeURIComponent(a.textContent.trim())}`);
      }
      a.removeAttribute("target");
    });
  }

  function wrapTables(root) {
    root.querySelectorAll("table").forEach(tbl => {
      if (tbl.parentElement && tbl.parentElement.classList.contains("table-wrap")) return;
      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      tbl.parentNode.insertBefore(wrapper, tbl);
      wrapper.appendChild(tbl);
    });
  }

  function downloadBlob(filename, content, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function fetchMarkdownText(entry) {
    try {
      const res = await fetch(entry.text, { cache: "no-store" });
      if (!res.ok) return "";
      return await res.text();
    } catch (_) {
      return "";
    }
  }

  async function renderAll() {
    const out = document.getElementById(OUTPUT_ID);
    const statusEl = document.getElementById(STATUS_ID);
    const jumpSelect = document.getElementById("jump-select");
    if (!out) return;

    let list = [];
    try {
      const res = await fetch("data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Could not load data.json");
      list = await res.json();
    } catch (err) {
      if (statusEl) statusEl.style.display = "none";
      out.innerHTML = `<div class="render-error"><h2>Error</h2><pre>${err.message}</pre></div>`;
      return;
    }

    if (typeof marked === "undefined") {
      if (statusEl) statusEl.style.display = "none";
      out.innerHTML = `<div class="render-error"><h2>Error</h2><pre>marked.min.js did not load.</pre></div>`;
      return;
    }

    if (jumpSelect) {
      list.forEach(entry => {
        const opt = document.createElement("option");
        opt.value = entry.id;
        opt.textContent = entry.dateRange && entry.dateRange !== "N/A"
          ? `${entry.id} — ${entry.dateRange}`
          : entry.id;
        jumpSelect.appendChild(opt);
      });
      jumpSelect.addEventListener("change", () => {
        if (!jumpSelect.value) return;
        const target = document.getElementById(jumpSelect.value);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    out.innerHTML = "";
    const mdCache = {};

    out.addEventListener("click", (e) => {
      const btn = e.target.closest(".github-report-btn");
      if (!btn) return;
      e.preventDefault();

      const entryId = btn.getAttribute("data-id");
      const section = btn.closest(".transcription-section");
      const sel = window.getSelection();
      let selectionText = "";

      if (sel.rangeCount > 0 && section && section.contains(sel.anchorNode)) {
        selectionText = sel.toString().trim();
      }

      let body = `**Transcription ID:** ${entryId}\n\n`;
      if (selectionText) {
        body += `**Original Text:**\n> ${selectionText.replace(/\n/g, '\n> ')}\n\n`;
      }
      body += `**Suggested Correction / Notes:**\n`;

      window.open(`https://github.com/${GITHUB_REPO}/issues/new?title=${encodeURIComponent('Transcription Note: ' + entryId)}&body=${encodeURIComponent(body)}`, '_blank');
    });

    out.addEventListener("change", (e) => {
      if (e.target.classList.contains("download-select")) {
        const format = e.target.value;
        const entryId = e.target.getAttribute("data-id");
        e.target.value = "";

        const md = mdCache[entryId];
        if (!md) return;

        const htmlContent = marked.parse(md);
        const exportStyles = `body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;}blockquote{border-left:4px solid #555;padding-left:15px;color:#555;}table{width:100%;border-collapse:collapse;margin:16px 0;}th,td{border:1px solid #888;padding:8px 10px;text-align:left;vertical-align:top;}th{background:#f0f0f0;}`;

        if (format === "md") {
          downloadBlob(`${entryId}.md`, md, "text/markdown;charset=utf-8");
        } else if (format === "html") {
          const page = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${entryId}</title><style>${exportStyles}</style></head><body>${htmlContent}</body></html>`;
          downloadBlob(`${entryId}.html`, page, "text/html;charset=utf-8");
        } else if (format === "doc") {
          const doc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${entryId}</title><style>${exportStyles}</style></head><body>${htmlContent}</body></html>`;
          downloadBlob(`${entryId}.doc`, doc, "application/msword;charset=utf-8");
        }
      }
    });

    let loadedCount = 0;
    const total = list.length;

    for (let start = 0; start < total; start += BATCH_SIZE) {
      const batch = list.slice(start, start + BATCH_SIZE);
      if (statusEl) {
        statusEl.textContent = `Loading transcriptions: ${loadedCount} / ${total}…`;
      }

      const texts = await Promise.all(batch.map(fetchMarkdownText));
      const frag = document.createDocumentFragment();

      batch.forEach((entry, idx) => {
        const mdText = texts[idx];
        loadedCount++;
        if (!mdText) return;

        mdCache[entry.id] = mdText;

        const section = document.createElement("div");
        section.className = "transcription-section";
        section.id = entry.id;

        const viewScanBtnHtml = `<a href="transcriptions.html?id=${encodeURIComponent(entry.id)}" class="btn">View Scan</a>`;
        const githubBtnHtml = `<a href="#" class="btn github-report-btn" data-id="${entry.id}" style="background:#2ea043; border-color:#2ea043; color:white; display:inline-flex; align-items:center; gap:6px;"><svg height="16" viewBox="0 0 16 16" width="16" style="fill:white;"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.46-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg> Report Issue on GitHub</a>`;
        const downloadSelectHtml = `<select class="download-select" data-id="${entry.id}" style="background:#2d2d2d; color:#e0e0e0; border:1px solid #444; border-radius:5px; padding:7px 12px; font-family:Arial, sans-serif; font-size:0.88rem; cursor:pointer;"><option value="" disabled selected>📥 Download...</option><option value="md">Markdown (.md)</option><option value="html">Webpage (.html)</option><option value="doc">Word (.doc)</option></select>`;

        const contentHTML = marked.parse(mdText);
        section.innerHTML = `<div class="section-head"><h2>${entry.id}</h2><div class="section-actions">${viewScanBtnHtml}${githubBtnHtml}${downloadSelectHtml}</div></div>` + contentHTML;

        rewriteCrossReferences(section);
        wrapTables(section);
        frag.appendChild(section);
      });

      out.appendChild(frag);
    }

    if (statusEl) {
      statusEl.style.display = "none";
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => { configureMarked(); renderAll(); });
  } else {
    configureMarked(); renderAll();
  }
})();
    </script>
</body>
</html>
